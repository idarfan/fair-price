default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host:     <%= ENV.fetch("DB_HOST",     "localhost") %>
  port:     <%= ENV.fetch("DB_PORT",     5432) %>
  username: <%= ENV.fetch("DB_USER",     "idarfan") %>
  password: <%= ENV.fetch("DB_PASSWORD", "") %>

# 這台機器上沒有獨立的開發資料庫——development 與 production 是同一份資料，
# 開發就是直接在正式資料上進行（2026-08-28 之前這份資料庫甚至叫
# fairprice_development，讓 production 看起來像跑在開發庫上）。
#
# 因為兩個環境共用同一個庫，Rails 的 protected_environments 保險會隨著
# 「最後一次 db:migrate 是用哪個 RAILS_ENV 跑的」而漂移，所以
# config/application.rb 把 development 也一併列入受保護環境，
# 讓 db:drop / db:reset / db:schema:load 在兩種情況下都被擋下來。
development:
  <<: *default
  database: fairprice_production

# .env 裡的 DATABASE_URL 指向正式資料庫，而 dotenv-rails 在 test 環境同樣會
# 載入 .env——沒有下面這行 `url:`，DATABASE_URL 會蓋掉 `database:`，整套測試
# 就會跑在正式資料上（rspec 讀得到真實資料、db:test:prepare 會試圖 purge
# 正式資料庫）。
#
# 明確指定 url 是唯一能穩定壓過 DATABASE_URL 的方式，而且寫在版控檔案裡，
# 不會像放在 .env.test 那樣在新環境 checkout 後無聲消失。
test:
  <<: *default
  database: fairprice_test
  url: <%= ENV.fetch("TEST_DATABASE_URL") do
             require "cgi"
             user = ENV.fetch("DB_USER", "idarfan")
             pass = CGI.escape(ENV.fetch("DB_PASSWORD", ""))
             host = ENV.fetch("DB_HOST", "localhost")
             port = ENV.fetch("DB_PORT", 5432)
             "postgresql://#{user}:#{pass}@#{host}:#{port}/fairprice_test"
           end %>

production:
  <<: *default
  database: fairprice_production
