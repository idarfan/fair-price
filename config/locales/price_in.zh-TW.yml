    # 教學說明（頁面最底、預設收摺）。
    #
    # 用 NOK 當貫穿案例而不是抽象規則：這份說明存在的理由，正是 2026-09-09
    # 實際看圖時踩到的三個誤讀——把圓點在色帶左側當成便宜、把現價反推的倍數
    # 當成市場的估值意願、把報酬全押在盈利達標而忽略倍數。抽象規則看得懂
    # 不代表套得到自己的情境，所以每一節都附上真實數字。
    #
    # 表格存成 headers ＋ rows 的結構化資料而不是預先排版好的字串：
    # 排版是 view 的責任，locale 只負責內容。
    tutorial:
      icon: 📘
      title: Price-In 工具教學：這張圖真正在說什麼
      intro: 以下用 NOK（股價 $10.93、TTM EPS $0.13、分析師 FY2027 預測 $0.44–$0.60）當貫穿案例。
      sections:
        - heading: 一、這個工具在回答什麼
          body:
            - 「這檔已經 price in 太多了」是一句無法驗證的話，因為它同時混了三個變數：要賺多少、給幾倍、從什麼價格買進。
            - 圖 A 固定價格問盈利——這個價格要求公司賺到多少？圖 B 固定盈利問價格——賺到了，從不同價位買進各值多少？
            - 兩張圖必須成組看。只看其中一張，就會落回「單一目標價」的錯覺。
        - heading: 二、最常見的誤讀：圓點在色帶左側不等於便宜
          body:
            - 圓點（現價反推所需 EPS）落在綠色色帶（分析師預測）左側，只代表一件事：市場預期這家公司未來賺得比現在多。
            - 任何轉機股與成長股都長這樣。它描述的是「當前獲利低、預期獲利高」的形狀，不是估值高低的判斷。
            - 要判斷貴賤，看的不是圓點與色帶的相對位置，而是下面第四節那個數字。
        - heading: 三、循環論證：倍數若來自現價 ÷ 現 EPS，圖 A 就是恆等式
          body:
            - NOK 現價 $10.93 ÷ TTM EPS $0.1267 = 86.27 倍。把 81.53、85.71 這類數字填回「本益比假設」，圖 A 反推出「需要 EPS $0.13」——那正是原本的 TTM EPS。
            - 這不是分析結果，是把 $10.93 ÷ 86 × 86 繞了一圈算回 $10.93。填了等於沒填。
            - 這也是為什麼 80 倍不能拿來當未來的假設：它不是市場的估值意願，是盈利被壓縮後的算術結果。分母只有 $0.13，倍數自然高。
          callout: 偵測到你填的倍數是現價反推來的，畫面上方會出現橘色警告。它不告訴你該填幾倍，只擋掉「填了等於沒填」的情況。
        - heading: 四、真正的入口：隱含 forward 倍數
          body:
            - 現價 ÷ 分析師預測 EPS。這個數字不需要你填任何假設，抓報價時就能算出來，估值對照區已直接顯示。
            - NOK：$10.93 ÷ $0.60 = 18.2 倍，$10.93 ÷ $0.44 = 24.8 倍。市場現在不是用 80 倍在買它，是用 18–25 倍在定價它未來的獲利。
            - 問題於是變成一句可以回答的話：一家成熟的電信設備商，該不該給 18–25 倍？
        - heading: 五、倍數的權重不比盈利低
          body:
            - 固定 EPS 為分析師預測平均值 $0.50、買入價 $10.93，只改倍數：
          table:
            headers:
              - 假設倍數
              - 目標價
              - 報酬
            rows:
              - [15 倍, $7.50, "-31.4%"]
              - [20 倍, $10.00, "-8.5%"]
              - [25 倍, $12.50, "+14.4%"]
              - [40 倍, $20.00, "+83.0%"]
              - [80 倍, $40.00, "+266.0%"]
          footer:
            - 盈利完全達標的情況下，報酬從 -31% 到 +266%。差別全部來自倍數。
            - 而 80 倍與 $0.50 的 EPS 在數學上幾乎不可能並存：EPS 若真的成長到 $0.50，股價原地不動的話倍數自動變成 21.9 倍。要維持 80 倍，股價得同步漲到 $40。
        - heading: 六、進場價是第三個變數
          body:
            - 圖 B 的欄位叫「假設買入價」而不是「現價」，因為它問的是你打算從什麼價格進場。現價只是預設值。
            - 固定 EPS $0.50、倍數 22 倍（目標價 $11.00），只改買入價：
          table:
            headers:
              - 買入價
              - 目標價
              - 報酬
            rows:
              - ["$10.93（現價）", $11.00, "+0.6%"]
              - [$9.50, $11.00, "+15.8%"]
              - [$8.00, $11.00, "+37.5%"]
          footer:
            - 在高倍數股票上，進場價的權重不比倍數假設低。
        - heading: 七、隱含 forward 倍數低，也不自動等於便宜
          body:
            - 21.9 倍只是把問題換到正確的位置，還缺兩個東西才能下判斷。
            - 其一，FY2027 之後還成長嗎？22 倍配 20% 續增是合理的，配 3% 續增就偏貴。單看一年的 forward 倍數會漏掉這個。
            - 其二，這個 $0.50 有多可信？色帶 $0.44–$0.60 的寬度（±16%）本身就是分析師分歧度的指標。帶越寬，倍數該給得越保守。
        - heading: 八、工具刻意不告訴你「合理倍數」
          body:
            - 任何自動給出「產業合理本益比」的工具，都在偷偷替你做最關鍵的那個判斷。
            - 本工具的立場是把三個變數攤平交回給你，代價是倍數得自己填。產業平均本益比只當對照，不給「帶入」按鈕——那是別人的倍數，不是你的出價假設。
        - heading: 九、建議的操作順序
          body:
            - 一、按「帶入現價」，取得股價、本益比區間與分析師預測。
            - 二、先看估值對照區的「隱含倍數（分析師預測）」——這是判斷貴賤的起點，不需要任何假設。
            - 三、圖 A 的本益比假設不要填現價反推的那個數字，填你認為合理的區間。
            - 四、圖 B 把 EPS 錨定在分析師預測平均值，倍數手動填合理區間（例如 15、20、25），看報酬的落差。
            - 五、調整「假設買入價」，找出讓風險報酬可以接受的進場點。
