# Price-In 反推工具文案。
#
# 集中在這裡是為了不硬編字串，不是為了多語系——本工具只支援繁體中文，
# 不做語系切換、不建簡體 locale 檔（規格 §S8.1）。
#
# 「為什麼要填」這類多句文案存成陣列，一個元素一句：在 locale 就切好，
# 比在 view 用 split("。") 可靠，也讓譯文與排版的責任分離（規格 §S4）。
zh-TW:
  price_in:
    cards:
      ticker:
        title: 卡片 0 ｜ 股票代號
        tone: green
        rows:
          - label: 要填什麼
            body:
              - 美股代號，例如 MRVL。
              - 填完可按「帶入現價」自動抓當前價格。
          - label: 為什麼要填
            body:
              - 代號有兩個用途。
              - 一是帶入現價，省得手動查；二是成為圖表頁首的標題，匯出的圖一眼就看得出在講哪一檔。
          - label: 抓不到怎麼辦
            body:
              - 手動填價格即可，圖表照常產出。
              - 這是估值工具，不是報價看板——價格是你要檢驗的假設，不是必須即時的數據。
          - label: 注意
            body:
              - 帶入現價後，價格欄位仍可自由修改。
              - 一旦手動改動，頁尾的報價時間戳會改成「手動輸入」，避免你把假設價誤當成真實報價。

      price:
        title: 卡片 1 ｜ 圖 A 輸入 · 你要檢驗的價格
        tone: orange
        rows:
          - label: 要填什麼
            body:
              - 你想檢驗的股價。
              - 可以是現價，也可以是你在考慮的任何一個價位。
          - label: 為什麼要填
            body:
              - Price-in 討論的起點永遠是「已經付了多少錢」。
              - 這個數字是分子，它決定了整張圖在要求公司交出什麼成績。
              - 填現價，你看到的是市場目前的要求；填一個更高的假設價，你看到的是「漲到那裡之後，門檻會變多高」。
          - label: 怎麼用
            body:
              - 先填現價看基準，再填一個你心中的目標價，比較兩者的 EPS 門檻差多少。

      multiples:
        title: 卡片 2 ｜ 圖 A 輸入 · 你願意給的本益比
        tone: yellow
        rows:
          - label: 要填什麼
            body:
              - 1 到 5 個本益比數字。
          - label: 為什麼要填
            body:
              - 唯一由你決定的變數，是假設不是預測。
              - 填三檔是為了逼自己面對憑什麼給這個倍數。
          - label: 怎麼用
            body:
              - 拿公司的歷史本益比中位數當錨點。
              - 要給高於中位數的倍數，你必須說得出理由（能見度改善、成長加速、客戶結構變化）；說不出來就往中位數靠。
          - label: 參考倍數怎麼看
            body:
              - 兩個隱含倍數的意思是「現價相當於你填的 EPS 的幾倍」。
              - 它們不是建議值，只是把你自己填的數字換個角度呈現。
              - 如果你願意給的倍數比隱含倍數低，代表你認為現價太貴。
          - label: 注意
            body:
              - 把倍數當成客觀事實是最常見的錯誤。
              - 它是你的出價意願。
              - 參考倍數只是對照，不會自動填進輸入框。

      fiscal_year:
        title: 卡片 3 ｜ 圖 A 輸入 · 對應年度
        tone: red
        rows:
          - label: 要填什麼
            body:
              - 這個 EPS 門檻對應的財政年度，例如 FY2028。
              - 必填，不能留空。
          - label: 為什麼必填
            body:
              - 「股價 ÷ 倍數 = 所需 EPS」這個算式裡沒有時間。
              - 同樣是 7.45 美元，如果 FY2028 就做到，這個價格很便宜；如果要等到 FY2031，這個價格是災難。
              - 年度沒寫清楚，整張圖就失去意義，所以系統不允許產出沒有年度標示的圖。
          - label: 怎麼填
            body:
              - 填你打算用來檢驗的那個年度，並且確認你引用的 EPS 預測也是同一個年度。
              - 兩邊年度對不上，是最常見的 Price-in 誤判來源。

      eps_band:
        title: 卡片 4 ｜ 圖 A 輸入 · EPS 一致預期區間（選填）
        tone: green
        rows:
          - label: 要填什麼
            body:
              - 市場對該年度 EPS 的預測下緣與上緣，以及一行來源說明。
              - 可以留空。
          - label: 為什麼要填
            body:
              - 前三個欄位只給你算術結果——這個價格需要多少 EPS。
              - 但「需要 7.45」本身不告訴你難不難。
              - 填入預測區間後，圖上會出現色帶，你就能直接看出現有預測撐不撐得住你的倍數假設。
          - label: 留空會怎樣
            body:
              - 圖照常產出，只是變成純算術對照，少了難易度的判斷基準。
          - label: 注意
            body:
              - 各家調整口徑不同（股票薪酬算不算費用差很多），因此填區間而不是單點。
              - 並在說明文字裡註明取樣範圍與日期。

      eps:
        title: 卡片 5 ｜ 圖 B 輸入 · 假設兌現的 EPS
        tone: green
        rows:
          - label: 要填什麼
            body:
              - 你假設公司未來某一年會賺到的每股盈利，以及對應的財政年度。
          - label: 這個數字代表什麼
            body:
              - 三個限定缺一不可——特定財政年度（FY2029 對應自然年 2028）、單一年度（那一年賺的，不是累計）、經過調整（非 GAAP，剔除項目各家不同）。
          - label: 為什麼要填
            body:
              - 圖 B 的設計是把盈利這個變數固定住。
              - 固定之後，剩下的差異就全部來自估值倍數和買入價——這正是要證明的東西：公司表現一樣，你的報酬還是可能天差地遠。
          - label: 怎麼用
            body:
              - 可以填市場一致預期，也可以填某個你認同的樂觀情境。
              - 它不需要是「對的預測」，但必須是你說得出來歷的數字。
              - 誠實標註它是哪一種、哪一年。
          - label: 注意
            body:
              - 引用某家投行的數字時，務必回頭核對三件事：哪一個財政年度、股票薪酬算不算費用、目標價有沒有折現。
              - 三者任一搞錯，整張圖的結論會反過來。

      entry_prices:
        title: 卡片 6 ｜ 圖 B 輸入 · 兩個買入價
        tone: orange
        rows:
          - label: 要填什麼
            body:
              - 兩個不同的買入價。
              - 預設是現價 223.55 與假設價 365。
          - label: 為什麼要填兩個
            body:
              - 這是整張圖的核心。
              - 同樣的 EPS、同樣的倍數，從不同價格買進，報酬完全不同。
              - 填一個價格你只會看到一組數字，填兩個你才會看到買入價的代價。
          - label: 怎麼填
            body:
              - 一個填你的實際成本或現價（基準），另一個填你想檢驗的價位——例如某個目標價，或你在考慮加碼的價位。
          - label: 重要提醒
            body:
              - 如果第二個價格取自某家機構的目標價，務必先確認那個目標價有沒有折現。
              - 折現過的目標價，在該價位買入仍可賺到折現率本身；未折現的目標價才等於把未來成長提前付光。
              - 搞錯這一點，整張圖的結論會反過來。

      holding:
        title: 卡片 7 ｜ 圖 B 輸入 · 持有年數與折現（選填）
        tone: yellow
        rows:
          - label: 持有年數
            body:
              - 填了之後，每個報酬數字下方會加註年化值。
              - -1.4% 和 +62.7% 如果都是兩年半的成果，年化後是 -0.6% 對 21%——差距比絕對值更有感。
          - label: 折現率與年數
            body:
              - 用來檢驗一個目標價背後的隱含報酬。
              - 輸入後系統會算出「在該價格買入、如期兌現」對應的年化報酬。
              - 這是判斷一個目標價到底有沒有留下空間給你的直接方法。
          - label: 兩者都可留空
            body:
              - 圖照常產出。

    lookup:
      eps_band:
        summary: 去哪裡查這兩個數字？
        steps_title: 步驟
        steps:
          - 先確定你要哪一個財政年度。各家標示方式不同，一定要看清楚是 fiscal year 還是 calendar year。
          - 找到該年度的 EPS 預測低標與高標，不是平均值。色帶要畫的是分歧程度，不是共識點。
          - 記下取樣日期與分析師家數，填進說明文字。
        sources_title: 免費查得到區間的來源
        sources:
          - site: Stock Analysis
            url: https://stockanalysis.com/stocks/%{ticker_downcase}/forecast/
            gets: 逐年 EPS 預測、分析師家數。頁面明載採非 GAAP 調整後數字、資料來自 S&P Global
          - site: ChartMill
            url: https://www.chartmill.com/stock/quote/%{ticker}/analyst-ratings
            gets: 逐年 EPS 估值、修正趨勢、涵蓋分析師數
          - site: Market Chameleon
            url: https://marketchameleon.com/Overview/%{ticker}/
            gets: 最近一季實際值與預期差，用來檢查前一季有沒有大幅偏離
        sources_note: 三個站都不需註冊或訂閱即可看到年度預測。清單只收免費可讀的來源——付費牆後的資料再準，工具裡放了也是給使用者添堵。
        pitfalls_title: 三個常見的坑
        pitfalls:
          - pit: 拿平均值當區間
            effect: 色帶變成一條線，看不出分歧
            avoid: 一定要找 Low / High 欄位
          - pit: 混用不同口徑
            effect: 下緣是 GAAP、上緣是非 GAAP，區間毫無意義
            avoid: 同一來源、同一口徑取兩端
          - pit: 用過期估值
            effect: 財報後估值會大幅修正，舊數字失效
            avoid: 只取最近一次財報後更新的估值，並記下日期

      eps:
        summary: 這個數字去哪裡查？
        kinds_title: 三種來源，可信度不同
        kinds:
          - source: 市場一致預期
            trait: 多家平均，變動較緩，最容易查
            fit: 想知道「市場目前相信什麼」
          - source: 單一投行模型
            trait: 分歧大，可能遠高或遠低於共識
            fit: 想檢驗某個特定的多空論點
          - source: 自己推算
            trait: 完全可控，來歷最清楚
            fit: 想檢驗自己的假設而非別人的
        sources_title: 免費查一致預期
        sources:
          - site: Stock Analysis
            url: https://stockanalysis.com/stocks/%{ticker_downcase}/forecast/
            gets: 逐年 EPS 預測。頁面明載採非 GAAP 調整後數字、資料來自 S&P Global
          - site: ChartMill
            url: https://www.chartmill.com/stock/quote/%{ticker}/analyst-ratings
            gets: 逐年 EPS 估值與修正趨勢
        sources_note: 查到之後記下三件事：年度標示（fiscal 還是 calendar）、口徑（頁面有沒有說明是否為調整後）、取樣日期。
        formula_title: 自己推算的方法
        formula: 調整後 EPS = 年營收 × 調整後淨利率 ÷ 稀釋在外股數
        formula_notes:
          - 年營收：一致預期網站有逐年營收預測；或用公司財報電話會議中自己給的目標。
          - 調整後淨利率：取最近幾季的實際值，再依你對規模效應的判斷調整。成長期公司通常會擴張，但不要外推得太樂觀。
          - 稀釋在外股數：財報中有；注意它會逐年變動——買回庫藏股會減少、股票薪酬會增加。用當前股數推算三年後的 EPS 是常見錯誤。
        checks_title: 用投行數字時的三個核對點
        checks:
          - point: 財政年度
            why: FY2029 和 2029 自然年差一年；FY2030 和 FY2029 的 EPS 可能差三成
          - point: 股票薪酬
            why: 算不算費用，同一家公司的 EPS 可以差 20% 以上
          - point: 有沒有折現
            why: 折現過的目標價，在該價位買入仍可賺到折現率；未折現的才等於把未來全部付光

    tour:
      button_input: 輸入導覽
      button_read: 讀圖導覽
      button_read_disabled: 先填入 EPS 才能看讀圖導覽
      button_walkthrough: 逐步導覽
      steps:
        - step: 1
          title: 這個工具在做什麼
          body:
            - 把「已經 price in 太多了」這句廢話，拆成三個可以填的數字：哪一年的 EPS、給幾倍、從什麼價格買。
            - 填完之後，貴或便宜就變成一個可以被反駁的具體主張。
        - step: 2
          title: 你要檢驗的價格
          body:
            - 填現價，看市場目前在要求什麼；填目標價，看漲到那裡之後門檻會變多高。
            - 這是整張圖的起點。
        - step: 3
          title: 你的出價意願（最容易出錯的一步）
          body:
            - 這是唯一由你決定的變數，是假設不是預測。
            - 千萬不要把「目前的本益比」填進來——它是現價除以 TTM EPS 算出來的，填回去必然得到目前的 EPS，那是循環論證。
            - 拿歷史中位數或同業中位數當錨點，要給更高就得說得出理由。
        - step: 4
          title: 為什麼這欄不能空
          body:
            - 股價除以倍數這個算式裡沒有時間。
            - 同樣是 7.45 美元，FY2028 做到很便宜，FY2031 才做到是災難。
            - 所以系統不允許產出沒有年度的圖。
        - step: 5
          title: 難易度的基準線
          body:
            - 前面算出「需要多少」，這裡告訴你「難不難」。
            - 按「帶入」會填入分析師預測的低標與高標，圖上就會出現色帶。
            - 要的是分歧範圍不是平均值：拿平均值色帶會縮成一條線，看不出難易度。
        - step: 6
          title: 把盈利固定住
          body:
            - 圖 B 的設計是鎖死盈利這個變數。
            - 鎖死之後，剩下的差異就全部來自倍數和買入價——這正是要證明的事。
        - step: 7
          title: 這張圖的核心
          body:
            - 填兩個價格，你才看得到買入價的代價。
            - 如果第二個取自機構目標價，先確認它有沒有折現。
        - step: 8
          title: 圖 A：這個價格在要求什麼
          body:
            - 固定股價，變動倍數，反推公司必須賺到多少。
            - 圖上唯一的計算是股價除以倍數，不含任何預測。
        - step: 9
          title: 圓點在色帶哪一側
          body:
            - 這是圖 A 最重要的資訊。
            - 圓點在色帶左側，現有預測撐得住；落在色帶中，需要偏上緣；落在右側，需要超出目前所有預測。
        - step: 10
          title: 長不代表好
          body:
            - 長條長度是公司必須賺到的金額。
            - 越長代表門檻越高、越難達成。倍數給得越低，長條越長。
            - 方向和一般長條圖的直覺相反。
        - step: 11
          title: 圖 B：買入價的代價
          body:
            - 盈利固定，只變買入價和倍數。
            - 這張圖回答的是：同樣的結果兌現，買貴和買便宜差多少。
        - step: 12
          title: 同一列的落差就是答案
          body:
            - 同樣的盈利、同樣的倍數，只因為買入價不同，一個賺六成，一個原地踏步。
            - 公司成長不等於你會賺，這就是完整的證明。
        - step: 13
          title: 倍數是報酬的另一半
          body:
            - 同一個買入價，低倍數和高倍數可以差六十個百分點以上。
            - 盈利與倍數是相乘關係：盈利成長 50%、倍數收縮 40%，結果是負 10%，不是正 10%。
        - step: 14
          title: 帶著數字去吵架
          body:
            - 下次有人說「已經 price in 太多」，把這張圖丟出去，問他：用哪一年的 EPS？什麼口徑？給幾倍？有沒有折現？
            - 四項答不出來的，就是在講廢話。
    reading:
      chart_a:
        title: 怎麼看這張圖
        icon: 🔍
        items:
          - head: 圓點在色帶的哪一側，是這張圖最重要的資訊。
            body:
              - 圓點 = 這個倍數所需要的 EPS。色帶 = 市場目前的預測範圍。
            bullets:
              - 圓點落在色帶左側 → 現有預測撐得住這個倍數，門檻已經達到
              - 圓點落在色帶之中 → 需要落在預測區間偏上緣，有機會但不寬裕
              - 圓點落在色帶右側 → 需要盈利超出目前所有預測，這個倍數是額外的樂觀
          - head: 長條越長，代表要求越高，不是越好。
            body:
              - 一般看長條圖會直覺認為長 = 好。
              - 這張圖相反：長條長度是「公司必須賺到的金額」，越長代表門檻越高、越難達成。
              - 給的倍數越低，長條越長。
          - head: 這張圖不做任何預測。
            body:
              - 圖上唯一的計算是「股價 ÷ 倍數」。
              - 倍數是你填的假設，色帶是你引用的第三方預測。
              - 這張圖只負責把你的假設攤開，不負責告訴你哪個對。
          - head: 換一個價格再看一次。
            body:
              - 把股價改成你的目標價重跑，比較兩張圖的門檻差多少。
              - 那個差額，就是漲到目標價需要額外 price in 的東西。

      chart_b:
        title: 怎麼看這張圖
        icon: 🔀
        items:
          - head: 先看同一列的兩條長條，這是這張圖的主角。
            body:
              - 同一列代表同樣的估值倍數、同樣的盈利兌現。
              - 兩條長條的落差，完全來自買入價的不同。
              - 以預設值為例，33 倍那一列：從 223.55 買進是 +62.7%，從 365 買進是 -0.4%。
              - 公司做到一模一樣的事，一個賺六成，一個原地踏步。這就是 price-in 的完整證明。
          - head: 再看跨列的變化，那是估值倍數的威力。
            body:
              - 同一個買入價，20 倍和 33 倍的結果可以差六十個百分點以上。
              - 這說明「公司賺多少」只是報酬的一半，「市場願意給幾倍」是另一半。
          - head: 兩者是相乘關係，不是相加。
            body:
              - 總報酬 =（未來 EPS ÷ 現在 EPS）×（未來倍數 ÷ 現在倍數）- 1
              - 盈利成長 50%、倍數收縮 40%，你的報酬是 -10%，不是 +10%。
              - 這就是高本益比的股票下跌起來特別兇的機制，也是「公司成長了但我沒賺到」的完整解釋。
          - head: 負報酬不代表公司變差。
            body:
              - 圖上所有情境的盈利假設都相同。
              - 出現負數，唯一的原因是買入價太高——買的時候已經把這些成長付掉了。
          - head: 別忘了問折現。
            body:
              - 如果第二個買入價來自某個機構目標價，先確認它有沒有折現回今天。
              - 折現過的目標價，在該價位買入仍可賺到折現率本身；未折現的才等於把未來全部付光。
              - 這一點搞錯，圖的結論會反過來。

      price_in_logic:
        title: price in 是什麼？怎麼判斷已經反應多少
        icon: 🧮
        items:
          - head: 一句話：把股價拆成「本益比 × EPS」。
            body:
              - 股價 = 你願意給的本益比 × 公司賺到的 EPS。
              - 兩個變數，市場已經先替你決定了其中一個組合，這就是「price in」。
              - 這張工具的用途是把那個組合攤開來，逼它變成可以被反駁的數字。
          - head: 判斷方式一：固定股價，看它在要求多少盈利。
            body:
              - 需要的 EPS = 股價 ÷ 你給的本益比。
              - 把這個數字拿去對照分析師預測區間的下限與上限。
              - 落在區間左側 → 現有預測撐得住，門檻已經達到。
              - 落在區間之中 → 需要落在預測偏上緣，有機會但不寬裕。
              - 落在區間右側 → 需要盈利超出目前所有預測，這個倍數是額外的樂觀。
          - head: 最常見的錯誤：拿現在的本益比當「假設」。
            body:
              - 現在的本益比是「現價 ÷ TTM EPS」算出來的。
              - 把它填回去當假設，需要的 EPS 必然等於 TTM EPS——你只是把除法倒推回去。
              - 這時候拿它跟明年的預測比，「需要 3.03、預測 3.92」看起來很安全，但它只證明了一件事：分析師預期明年比去年賺得多。
              - 任何一家成長中的公司都會通過這個測試，包括泡沫頂點的那些。
              - 倍數必須是你自己的判斷：歷史中位數、同業中位數、或你說得出理由的數字。
          - head: 判斷方式二：反過來看你正在付幾倍。
            body:
              - 現價 ÷ 分析師預測區間兩端 = 你正在付未來盈利的幾倍。
              - 這個方向不需要你先給倍數，因此不會有循環論證的問題。
              - 問題從「需要賺多少」變成「這個倍數你給不給」——後者才是真正的判斷。
          - head: 兩個一定要對齊的東西。
            body:
              - 年度：需要的 EPS 沒有時間，預測區間有。兩邊必須是同一個財政年度，否則整個比較無效。
              - 口徑：GAAP 與非 GAAP 的 EPS 常差到倍數等級。下緣取 GAAP、上緣取非 GAAP，區間毫無意義。
          - head: 「安全邊際」不是這樣算的。
            body:
              - 安全邊際講的是價值與價格的差距，前提是你有一個站得住的價值估計。
              - 這張圖只告訴你「這個價格在要求什麼」，不告訴你那個要求合不合理。
              - 合不合理，取決於你填的倍數說不說得出理由。

