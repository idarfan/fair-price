<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>期權小學堂 · 課程總覽</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:         #FAF3E8;
  --page-bg:    #FFF9F2;
  --panel-bg:   #FFFCF7;
  --ink:        #2A1A0E;
  --muted:      #7A6555;
  --border:     #E2D4C2;
  --gold:       #D4900A;
  --gold-bg:    #FEF4D8;
  --gold-bdr:   #E8B840;
  --green:      #2E9E52;
  --green-bg:   #E8F8EE;
  --green-bdr:  #8ED4A8;
  --red:        #D04040;
  --red-bg:     #FDEAEA;
  --red-bdr:    #F5AAAA;
  --blue:       #3A70C0;
  --blue-bg:    #EBF2FF;
  --blue-bdr:   #9ABCE8;
  --purple:     #7050C0;
  --purple-bg:  #F0EAFF;
  --purple-bdr: #C0A8F0;
  --r-lg: 16px;
  --r-md: 10px;
  --r-sm: 6px;
}

body {
  background: var(--bg);
  font-family: "PingFang TC", "Microsoft JhengHei", "Heiti TC", system-ui, sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Hero header ─────────────────── */
.hero {
  padding: 48px 40px 36px;
  max-width: 1200px;
  margin: 0 auto;
}

.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--ink);
  color: #FFF9F0;
  font-size: 12px;
  font-weight: 700;
  padding: 5px 16px;
  border-radius: 100px;
  letter-spacing: 1.5px;
  margin-bottom: 20px;
}

.hero-title {
  font-size: 48px;
  font-weight: 900;
  color: var(--ink);
  line-height: 1.1;
  margin-bottom: 12px;
}

.hero-title span {
  color: var(--gold);
}

.hero-subtitle {
  font-size: 16px;
  color: var(--muted);
  font-weight: 500;
  margin-bottom: 8px;
}

.hero-desc {
  font-size: 14px;
  color: var(--muted);
  line-height: 1.7;
  max-width: 560px;
}

.hero-meta {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-top: 24px;
}

.meta-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
}

.meta-dot {
  width: 6px;
  height: 6px;
  border-radius: 100px;
  background: var(--border);
}

/* ── Toolbar ─────────────────────── */
.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 40px 20px;
  max-width: 1200px;
  margin: 0 auto;
}

.toolbar-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-right: auto;
}

.btn-tool {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 700;
  padding: 7px 14px;
  border-radius: var(--r-sm);
  border: 1.5px solid var(--border);
  background: var(--panel-bg);
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
  letter-spacing: 0.3px;
}

.btn-tool:hover {
  border-color: var(--gold-bdr);
  color: var(--gold);
  background: var(--gold-bg);
}

.btn-tool.active {
  background: var(--ink);
  border-color: var(--ink);
  color: #FFF9F0;
}

/* ── Cards scroll area ───────────── */
.scroll-track {
  padding: 0 40px 60px;
}

.cards-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
  padding: 12px 0 20px;
}

/* ── Card ─────────────────────────── */
.lesson-card {
  background: var(--page-bg);
  border: 2px solid var(--border);
  border-radius: var(--r-lg);
  display: flex;
  flex-direction: column;
  gap: 0;
  transition: box-shadow 0.2s, transform 0.15s;
  cursor: grab;
  position: relative;
}

.lesson-card.dragging {
  box-shadow: 0 20px 60px rgba(42,26,14,0.18);
  transform: scale(1.03) rotate(1deg);
  z-index: 100;
  opacity: 0.95;
  cursor: grabbing;
}

.lesson-card.drag-over {
  border-color: var(--gold-bdr);
  background: var(--gold-bg);
}

/* Card: visual banner */
.card-banner {
  height: 140px;
  border-radius: calc(var(--r-lg) - 2px) calc(var(--r-lg) - 2px) 0 0;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  font-size: 64px;
  flex-shrink: 0;
}

.card-banner::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(160deg, rgba(255,255,255,0.12) 0%, transparent 60%);
  pointer-events: none;
}

.banner-l0 { background: linear-gradient(135deg, #3A70C0 0%, #2A4E90 100%); }
.banner-l1 { background: linear-gradient(135deg, #D4900A 0%, #9E6206 100%); }
.banner-l2 { background: linear-gradient(135deg, #2E9E52 0%, #1A6E38 100%); }
.banner-l3 { background: linear-gradient(135deg, #7050C0 0%, #4C36A0 100%); }
.banner-l4 { background: linear-gradient(135deg, #D04040 0%, #A02828 100%); }
.banner-l5 { background: linear-gradient(135deg, #5A6E2A 0%, #3A4E1A 100%); }
.banner-l6 { background: linear-gradient(135deg, #2A9E9E 0%, #1A6E6E 100%); }
.banner-l7 { background: linear-gradient(135deg, #9E5A2A 0%, #6E3A1A 100%); }
.banner-l8 { background: linear-gradient(135deg, #2A6EA0 0%, #1A4E78 100%); }
.banner-l9 { background: linear-gradient(135deg, #7A4A0A 0%, #C08010 100%); }
.banner-l10 { background: linear-gradient(135deg, #0E6E5A 0%, #0EA87A 100%); }

.card-number {
  position: absolute;
  top: 12px;
  left: 14px;
  background: rgba(255,249,240,0.2);
  border: 1.5px solid rgba(255,249,240,0.35);
  color: #FFFDF8;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1.5px;
  padding: 4px 10px;
  border-radius: 100px;
  text-transform: uppercase;
}

.card-badge {
  position: absolute;
  top: 12px;
  right: 14px;
}

/* Card: body */
.card-body {
  padding: 20px 20px 0;
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.card-tag-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 100px;
  letter-spacing: 0.3px;
}

.pill-outline {
  background: transparent;
  border: 1.5px solid;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 1px;
}

.pill.setup   { color: #7A6555; background: #F0E8DC; }
.pill.win     { color: var(--green); background: var(--green-bg); }
.pill.blue    { color: var(--blue); background: var(--blue-bg); }
.pill.purple  { color: var(--purple); background: var(--purple-bg); }
.pill.gold    { color: var(--gold); background: var(--gold-bg); }
.pill.red     { color: var(--red); background: var(--red-bg); }

.card-title {
  font-size: 20px;
  font-weight: 900;
  color: var(--ink);
  line-height: 1.25;
}

.card-subtitle {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: 0.3px;
}

/* Editable description */
.card-desc {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.65;
  border-radius: var(--r-sm);
  border: 1.5px solid transparent;
  padding: 6px 8px;
  margin: 0 -8px;
  outline: none;
  transition: border-color 0.15s, background 0.15s;
  cursor: text;
  min-height: 72px;
}

.card-desc:focus {
  border-color: var(--gold-bdr);
  background: var(--gold-bg);
}

.card-desc:hover:not(:focus) {
  border-color: var(--border);
  background: #FFFBF5;
}

/* Edit hint */
.edit-hint {
  font-size: 10px;
  color: var(--gold);
  opacity: 0;
  font-weight: 600;
  letter-spacing: 0.5px;
  transition: opacity 0.15s;
  display: flex;
  align-items: center;
  gap: 4px;
}

.lesson-card:hover .edit-hint {
  opacity: 1;
}

/* Card: key points */
.card-points {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 14px 0 0;
  border-top: 1.5px solid var(--border);
  margin-top: 4px;
}

.point-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  font-size: 12px;
  color: var(--muted);
  line-height: 1.5;
}

.point-dot {
  width: 6px;
  height: 6px;
  border-radius: 100px;
  background: var(--gold-bdr);
  flex-shrink: 0;
  margin-top: 5px;
}

/* Card: footer */
.card-footer {
  padding: 16px 20px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.diff-badge {
  display: flex;
  align-items: center;
  gap: 4px;
}

.diff-star {
  font-size: 13px;
  line-height: 1;
}

.diff-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.btn-start {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--ink);
  color: #FFF9F0;
  font-size: 13px;
  font-weight: 700;
  padding: 9px 20px;
  border-radius: var(--r-md);
  text-decoration: none;
  letter-spacing: 0.3px;
  transition: background 0.15s, transform 0.1s;
  border: none;
  cursor: pointer;
}

.btn-start:hover {
  background: #1A0A04;
  transform: translateY(-1px);
}

.btn-start:active {
  transform: translateY(0);
}

/* ── Progress indicator ──────────── */
.progress-track {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 40px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.prog-step {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
}

.prog-dot {
  width: 28px;
  height: 28px;
  border-radius: 100px;
  background: var(--panel-bg);
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 800;
  color: var(--muted);
  flex-shrink: 0;
  transition: all 0.2s;
  cursor: pointer;
  text-decoration: none;
}

.prog-dot:hover {
  border-color: var(--gold-bdr);
  background: var(--gold-bg);
  color: var(--gold);
}

.prog-line {
  flex: 1;
  height: 2px;
  background: var(--border);
  border-radius: 100px;
}

/* ── Section divider ─────────────── */
.section-divider {
  max-width: 1200px;
  margin: 0 auto 28px;
  padding: 0 40px;
  display: flex;
  align-items: center;
  gap: 16px;
}

.divider-line {
  flex: 1;
  height: 1.5px;
  background: var(--border);
  border-radius: 100px;
}

.divider-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 1.5px;
  text-transform: uppercase;
  white-space: nowrap;
}

/* ── Drag ghost ──────────────────── */
.drag-ghost {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  opacity: 0.85;
  transform: scale(1.04) rotate(2deg);
  box-shadow: 0 24px 60px rgba(42,26,14,0.2);
}


/* ── Toast ───────────────────────── */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--ink);
  color: #FFF9F0;
  font-size: 13px;
  font-weight: 600;
  padding: 10px 20px;
  border-radius: var(--r-md);
  transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
  z-index: 10000;
  pointer-events: none;
  white-space: nowrap;
}

.toast.show {
  transform: translateX(-50%) translateY(0);
}

/* ── Footer ──────────────────────── */
.footer {
  padding: 32px 40px;
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-top: 1.5px solid var(--border);
}

.footer-left {
  font-size: 13px;
  color: var(--muted);
}

.footer-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

.footer-link {
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  text-decoration: none;
  letter-spacing: 0.5px;
}

.footer-link:hover {
  color: var(--gold);
}

/* ── TTS read button on cards ── */
.btn-tts {
  display: inline-flex; align-items: center; gap: 5px;
  background: transparent; color: var(--muted);
  font-size: 12px; font-weight: 700; padding: 7px 12px;
  border-radius: var(--r-md); border: 1.5px solid var(--border);
  cursor: pointer; font-family: inherit; white-space: nowrap;
  transition: background 0.15s, color 0.15s, border-color 0.15s;
}
.btn-tts:hover { background: var(--gold-bg); color: var(--gold); border-color: var(--gold-bdr); }
.btn-tts.playing { background: var(--gold-bg); color: var(--gold); border-color: var(--gold-bdr); }
.btn-tts.paused  { background: #EBF2FF; color: var(--blue); border-color: var(--blue-bdr); }
</style>
</head>

const STORAGE_KEY = 'idx-courses-v2';

/* ── State ────────────────────────── */
let courses = [];

function loadCourses() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      // Merge saved order + descriptions with defaults (handle new courses)
      const byId = {};
      DEFAULT_COURSES.forEach(c => byId[c.id] = { ...c });
      const result = [];
      parsed.forEach(s => {
        if (byId[s.id]) {
          byId[s.id].desc = s.desc;
          result.push(byId[s.id]);
          delete byId[s.id];
        }
      });
      Object.values(byId).forEach(c => result.push(c));
      return result;
    }
  } catch (_) {}
  return DEFAULT_COURSES.map(c => ({ ...c }));
}

function saveCourses() {
  const data = courses.map(c => ({ id: c.id, desc: c.desc }));
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

/* ── Render ───────────────────────── */
function renderProgress() {
  const track = document.getElementById('progress-track');
  track.innerHTML = courses.map((c, i) => `
    <div class="prog-step">
      <a class="prog-dot" href="${c.url}" title="${c.title}">${i}</a>
      ${i < courses.length - 1 ? '<div class="prog-line"></div>' : ''}
    </div>
  `).join('');
}

function renderCards() {
  const row = document.getElementById('cards-row');
  row.innerHTML = courses.map((c, i) => `
    <div class="lesson-card" data-id="${c.id}" draggable="true">
      <div class="card-banner ${c.banner}">
        <span>${c.emoji}</span>
        <div class="card-number">${c.num}</div>
      </div>
      <div class="card-body">
        <div class="card-tag-row">
          ${c.tags.map(t => `<span class="pill ${t.cls}">${t.label}</span>`).join('')}
          <span class="edit-hint">✏️ 點擊筆記可編輯</span>
        </div>
        <div class="card-title">${c.title}</div>
        <div class="card-subtitle">${c.subtitle}</div>
        <div
          class="card-desc"
          contenteditable="true"
          spellcheck="false"
          data-id="${c.id}"
          title="點擊編輯課程筆記"
        >${escHtml(c.desc)}</div>
        <div class="card-points">
          ${c.points.map(p => `
            <div class="point-item">
              <div class="point-dot"></div>
              <span>${escHtml(p)}</span>
            </div>
          `).join('')}
        </div>
      </div>
      <div class="card-footer">
        <div class="diff-badge">
          <span class="diff-star">${c.difficulty}</span>
          <span class="diff-label">${c.diffLabel}</span>
        </div>
        <button class="btn-tts" id="tts-btn-${c.id}" onclick="cardTts('${c.id}')" title="朗讀課程介紹">&#128266; 朗讀</button>
        <a class="btn-start" href="${c.url}">開始學習 →</a>
      </div>
    </div>
  `).join('');

  bindCardEvents();
}

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ── Drag & Drop (reorder) ────────── */
let dragSrc = null;
let dragIdx = -1;

function bindCardEvents() {
  const cards = document.querySelectorAll('.lesson-card');

  cards.forEach((card, i) => {
    // Drag start
    card.addEventListener('dragstart', e => {
      dragSrc = card;
      dragIdx = i;
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', i);
      // Defer so the browser captures a clean ghost
      setTimeout(() => card.style.opacity = '0.4', 0);
    });

    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      card.style.opacity = '';
      document.querySelectorAll('.lesson-card').forEach(c => c.classList.remove('drag-over'));
      dragSrc = null;
    });

    card.addEventListener('dragover', e => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      if (card !== dragSrc) {
        document.querySelectorAll('.lesson-card').forEach(c => c.classList.remove('drag-over'));
        card.classList.add('drag-over');
      }
    });

    card.addEventListener('dragleave', () => {
      card.classList.remove('drag-over');
    });

    card.addEventListener('drop', e => {
      e.preventDefault();
      if (dragSrc && card !== dragSrc) {
        const row = document.getElementById('cards-row');
        const cards = [...row.children];
        const fromIdx = cards.indexOf(dragSrc);
        const toIdx = cards.indexOf(card);

        // Reorder data
        const [moved] = courses.splice(fromIdx, 1);
        courses.splice(toIdx, 0, moved);

        saveCourses();
        render();
        showToast('✓ 順序已更新');
      }
      card.classList.remove('drag-over');
    });

    // Stop drag from firing on editable desc
    const desc = card.querySelector('.card-desc');
    if (desc) {
      desc.addEventListener('mousedown', e => e.stopPropagation());
      desc.addEventListener('dragstart', e => e.preventDefault());

      desc.addEventListener('blur', () => {
        const id = desc.dataset.id;
        const course = courses.find(c => c.id === id);
        if (course && course.desc !== desc.textContent.trim()) {
          course.desc = desc.textContent.trim();
          saveCourses();
          showToast('✓ 筆記已儲存');
        }
      });

      desc.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          desc.blur();
        }
      });
    }
  });
}


/* ── Actions ─────────────────────── */
function saveAll() {
  // Sync all edited descs from DOM
  document.querySelectorAll('.card-desc').forEach(desc => {
    const id = desc.dataset.id;
    const course = courses.find(c => c.id === id);
    if (course) course.desc = desc.textContent.trim();
  });
  saveCourses();
  showToast('✓ 所有筆記已儲存');
}

function resetOrder() {
  if (!confirm('還原為預設順序並重設所有筆記？')) return;
  localStorage.removeItem(STORAGE_KEY);
  courses = DEFAULT_COURSES.map(c => ({ ...c }));
  render();
  showToast('↺ 已還原預設');
}

/* ── Toast ───────────────────────── */
let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ── Full render ─────────────────── */
function render() {
  renderProgress();
  renderCards();
}


/* ── Card TTS ─────────────────────────────────────────────── */
let _cardTtsId = null;
let _cardTtsPaused = false;

function cardTts(id) {
  const btn = document.getElementById('tts-btn-' + id);
  if (!btn) return;

  // 同一張卡：暫停 ↔ 繼續 ↔ 停止
  if (_cardTtsId === id) {
    if (speechSynthesis.speaking && !speechSynthesis.paused) {
      speechSynthesis.pause();
      _cardTtsPaused = true;
      _updateCardTtsBtns();
      return;
    }
    if (speechSynthesis.paused) {
      speechSynthesis.resume();
      _cardTtsPaused = false;
      _updateCardTtsBtns();
      return;
    }
  }

  // 停掉其他卡的播放
  speechSynthesis.cancel();
  _cardTtsId = null;
  _cardTtsPaused = false;
  _updateCardTtsBtns();

  const course = courses.find(c => c.id === id);
  if (!course) return;

  const text = [
    course.title + '。',
    course.subtitle + '。',
    course.desc,
    '重點：' + course.points.join('；')
  ].join(' ');

  const utt = new SpeechSynthesisUtterance(text);
  utt.lang = 'zh-TW';
  utt.rate = 0.9;

  _cardTtsId = id;
  _updateCardTtsBtns();

  utt.onend = utt.onerror = function(e) {
    if (e.type === 'error' && e.error === 'interrupted') return;
    _cardTtsId = null;
    _cardTtsPaused = false;
    _updateCardTtsBtns();
  };

  setTimeout(function() { speechSynthesis.speak(utt); }, 30);
}

function _updateCardTtsBtns() {
  document.querySelectorAll('.btn-tts').forEach(function(btn) {
    const id = btn.id.replace('tts-btn-', '');
    btn.classList.remove('playing', 'paused');
    if (id === _cardTtsId) {
      if (_cardTtsPaused) {
        btn.classList.add('paused');
        btn.innerHTML = '&#9658; 繼續';
      } else {
        btn.classList.add('playing');
        btn.innerHTML = '&#9646;&#9646; 暫停';
      }
    } else {
      btn.innerHTML = '&#128266; 朗讀';
    }
  });
}

/* ── Init ────────────────────────── */
courses = loadCourses();
render();
</script>
