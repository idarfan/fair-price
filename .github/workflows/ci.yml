name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  # 2026-09-27：前端檢查（tsc、eslint、vitest）。只需要 Node：
  # vitest.config.ts 不載入 vite-plugin-ruby、環境是 happy-dom，不需要 Ruby、資料庫或前端建置。
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      # tsconfig.json：strict、noUncheckedIndexedAccess，範圍 app/frontend 與 stories
      - name: Type check (tsc --noEmit)
        run: npm run typecheck

      # 只有 error 會讓 job 失敗；目前 11 個 react-hooks/set-state-in-effect 為 warn
      - name: Lint (eslint)
        run: npm run lint

      - name: Run vitest
        run: npm test

  # 2026-09-27：CI 原本不跑 rspec。這個 job 在 GitHub 的臨時機器上跑全套測試，
  # 資料庫是 job 內的 postgres 服務容器（帳密為 CI 專用假值），跑完即銷毀；
  # 不讀 .env／.env.test（gitignore，CI 上不存在），也不可能連到正式庫。
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: fairprice_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RAILS_ENV: test
      # config/database.yml 的 test 區塊優先讀這個變數
      TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/fairprice_test
      # 程式以沒有預設值的 ENV.fetch 讀取；測試不會真的呼叫外部服務（WebMock 擋外網），給假值即可
      FINNHUB_API_KEY: ci-dummy
      TELEGRAM_BOT_TOKEN: ci-dummy
      OUOU_TELEGRAM_CHAT_ID: ci-dummy
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      # config/vite.json 的 test 環境 autoBuild，但 repo 沒有 bin/vite binstub；
      # 先明確建置到 public/vite-test，request spec 渲染頁面時直接讀 manifest。
      - name: Build frontend for test
        run: bundle exec vite build

      - name: Load schema
        run: bin/rails db:schema:load

      - name: Show test database（證明連的是 CI 的測試庫）
        run: bin/rails runner 'c = ActiveRecord::Base.connection; puts "database=#{c.current_database} user=#{c.select_value("select current_user")}"'

      - name: Run rspec
        run: bundle exec rspec

